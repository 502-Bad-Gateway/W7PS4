name: Materialize Build 11 source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-build11.yml

permissions:
  contents: write

concurrency:
  group: materialize-build11
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize exact Build 11 transforms
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply and commit exact Build 11 transforms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetBranch = 'milestone-a-build11-materialized'

          if (Test-Path 'ci/build11-materialized.json') {
            throw 'Build 11 is already materialized on this source branch.'
          }

          git ls-remote --exit-code --heads origin "refs/heads/$targetBranch" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Target branch already exists: $targetBranch"
          }
          if ($LASTEXITCODE -ne 2) {
            throw 'Could not verify that the target materialization branch is absent.'
          }

          $r2Patch = 'ci/build09r2-preserve-fragment-binding-slots.patch'
          git apply --recount --check $r2Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 09-r2 patch check failed.' }
          git apply --recount $r2Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 09-r2 patch apply failed.' }

          $build10Patch = 'ci/build10-disable-push-descriptors.patch'
          git apply --recount --check $build10Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 10 patch check failed.' }
          git apply --recount $build10Patch
          if ($LASTEXITCODE -ne 0) { throw 'Build 10 patch apply failed.' }

          & ./ci/apply-build11.ps1
          & ./ci/fix-build11-draw-sites.ps1

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Materialized source failed git diff --check.' }

          $expected = @(
            'src/emulator.cpp'
            'src/video_core/renderer_vulkan/vk_graphics_pipeline.cpp'
            'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp'
            'src/video_core/renderer_vulkan/vk_rasterizer.cpp'
            'src/video_core/renderer_vulkan/vk_rasterizer.h'
            'src/video_core/safe_gpu/safe_gpu.cpp'
            'src/video_core/safe_gpu/safe_gpu.h'
          ) | Sort-Object
          $actual = @(git diff --name-only) | Sort-Object
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($difference) {
            $difference | Out-String | Write-Host
            throw 'Materialization changed an unexpected file set.'
          }

          $rasterizer = [IO.File]::ReadAllText('src/video_core/renderer_vulkan/vk_rasterizer.cpp')
          $directCount = [regex]::Matches(
            $rasterizer,
            'PersistLastSubmittedGraphicsPipeline\(pipeline, "direct", is_indexed\);'
          ).Count
          $indirectCount = [regex]::Matches(
            $rasterizer,
            'PersistLastSubmittedGraphicsPipeline\(pipeline, "indirect", is_indexed\);'
          ).Count
          if ($directCount -ne 1 -or $indirectCount -ne 1) {
            throw "Draw-site verification failed: direct=$directCount indirect=$indirectCount"
          }

          $sourceDiffBlob = (git diff --binary --no-ext-diff | git hash-object --stdin).Trim()
          if ($LASTEXITCODE -ne 0 -or !$sourceDiffBlob) {
            throw 'Could not identify the materialized source diff.'
          }

          $manifest = [ordered]@{
            format_version = 1
            historical_source_head = '81b53122760c949aee1b0529c9632585d021e38d'
            build11_transform_parent = '340968cb794f200ab8c93cf0b1d2c7756f013470'
            publication_parent = $env:GITHUB_SHA
            source_diff_git_blob = $sourceDiffBlob
            transforms = @(
              'ci/build09r2-preserve-fragment-binding-slots.patch'
              'ci/build10-disable-push-descriptors.patch'
              'ci/apply-build11.ps1'
              'ci/fix-build11-draw-sites.ps1'
            )
            modified_source_files = $expected
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText(
            'ci/build11-materialized.json',
            $manifestJson + "`n",
            [Text.UTF8Encoding]::new($false)
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $expected 'ci/build11-materialized.json'
          git commit -m 'Materialize exact Build 11 CI transformations'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the materialization commit.' }

          $materializedCommit = (git rev-parse HEAD).Trim()
          if (git status --porcelain) {
            throw 'Working tree is not clean after the materialization commit.'
          }

          git push origin "HEAD:refs/heads/$targetBranch"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the materialization branch.' }

          "### Build 11 materialization`n`n- Commit: ``$materializedCommit```n- Diff blob: ``$sourceDiffBlob```n- Draw markers: direct=1, indirect=1" |
            Add-Content $env:GITHUB_STEP_SUMMARY
